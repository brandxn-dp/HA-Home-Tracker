# Full Chores dashboard (generated by scripts/build_dashboard.py).
# Dashboard → ⋮ → Edit → ⋮ → Raw configuration editor, then paste.

title: Chores
views:
- title: Chores
  path: chores
  icon: mdi:broom
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Chores
      heading_style: title
      icon: mdi:broom
    - type: heading
      heading: Tap a chore when it's done · hold for details
      heading_style: subtitle
    - type: custom:bubble-card
      card_type: button
      button_type: slider
      entity: sensor.mow_the_lawn_progress
      name: Mow the Lawn
      icon: mdi:mower
      read_only_slider: true
      slider_value_position: hidden
      state_content: '{% from ''chore_tracker.jinja'' import chore_due_text %}{{ chore_due_text(''sensor.chores_mow_the_lawn'', 7) }}'
      tap_action: &id001
        action: perform-action
        perform_action: chore_calendar.complete_item
        data:
          entity_id: sensor.chores_mow_the_lawn
      hold_action: &id002
        action: more-info
        entity: sensor.chores_mow_the_lawn
      button_action:
        tap_action: *id001
        hold_action: *id002
      styles: ".bubble-range-fill {\n  background: #a0784f !important;\n  opacity: 1 !important;\n}\n"
      grid_options:
        columns: 6
    - type: custom:bubble-card
      card_type: button
      button_type: slider
      entity: sensor.take_out_trash_progress
