# A two-column grid of chores, like the screenshot in the README.
# Each card is the same as bubble-card-chore.yaml with comments removed.
#
# The "Clean Gutters" card shows the two optional variants:
#   - invert_slider_value: true  -> the bar empties instead of filling
#   - a bar colour that shifts green -> amber -> red as the chore gets closer to due

type: grid
columns: 2
square: false
cards:
  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: sensor.mow_the_lawn_progress
    name: Mow the Lawn
    icon: mdi:mower
    read_only_slider: true
    slider_value_position: hidden
    state_content: >-
      {% from 'chore_tracker.jinja' import chore_due_text %}{{ chore_due_text('sensor.mow_the_lawn') }}
    tap_action:
      action: perform-action
      perform_action: chore_helper.complete
      target:
        entity_id: sensor.mow_the_lawn
    hold_action:
      action: more-info
      entity: sensor.mow_the_lawn
    button_action:
      tap_action:
        action: perform-action
        perform_action: chore_helper.complete
        target:
          entity_id: sensor.mow_the_lawn
      hold_action:
        action: more-info
        entity: sensor.mow_the_lawn
    styles: |
      .bubble-range-fill { background: #a0784f !important; opacity: 1 !important; }

  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: sensor.water_plants_progress
    name: Water Plants
    icon: mdi:watering-can
    read_only_slider: true
    slider_value_position: hidden
    state_content: >-
      {% from 'chore_tracker.jinja' import chore_due_text %}{{ chore_due_text('sensor.water_plants') }}
    tap_action:
      action: perform-action
      perform_action: chore_helper.complete
      target:
        entity_id: sensor.water_plants
    hold_action:
      action: more-info
      entity: sensor.water_plants
    button_action:
      tap_action:
        action: perform-action
        perform_action: chore_helper.complete
        target:
          entity_id: sensor.water_plants
      hold_action:
        action: more-info
        entity: sensor.water_plants
    styles: |
      .bubble-range-fill { background: #5b7fa6 !important; opacity: 1 !important; }

  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: sensor.take_out_trash_progress
    name: Take Out Trash
    icon: mdi:trash-can-outline
    read_only_slider: true
    slider_value_position: hidden
    state_content: >-
      {% from 'chore_tracker.jinja' import chore_due_text %}{{ chore_due_text('sensor.take_out_trash') }}
    tap_action:
      action: perform-action
      perform_action: chore_helper.complete
      target:
        entity_id: sensor.take_out_trash
    hold_action:
      action: more-info
      entity: sensor.take_out_trash
    button_action:
      tap_action:
        action: perform-action
        perform_action: chore_helper.complete
        target:
          entity_id: sensor.take_out_trash
      hold_action:
        action: more-info
        entity: sensor.take_out_trash
    styles: |
      .bubble-range-fill { background: #a8457a !important; opacity: 1 !important; }

  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: sensor.clean_gutters_progress
    name: Clean Gutters
    icon: mdi:home-roof
    read_only_slider: true
    slider_value_position: hidden
    invert_slider_value: true
    state_content: >-
      {% from 'chore_tracker.jinja' import chore_due_text %}{{ chore_due_text('sensor.clean_gutters') }}
    tap_action:
      action: perform-action
      perform_action: chore_helper.complete
      target:
        entity_id: sensor.clean_gutters
    hold_action:
      action: more-info
      entity: sensor.clean_gutters
    button_action:
      tap_action:
        action: perform-action
        perform_action: chore_helper.complete
        target:
          entity_id: sensor.clean_gutters
      hold_action:
        action: more-info
        entity: sensor.clean_gutters
    styles: |
      .bubble-range-fill {
        {% set p = states('sensor.clean_gutters_progress') | float(0) %}
        background: {{ '#4caf50' if p < 60 else '#ffa000' if p < 90 else '#e53935' }} !important;
        opacity: 1 !important;
      }
